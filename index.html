<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tolis Atari 2600</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:16px;background:#151515;color:#f5f5f5;font:16px Arial,sans-serif;text-align:center}h1{color:#ffb52e}.panel{max-width:950px;margin:12px auto;padding:14px;background:#252525;border:1px solid #555;border-radius:10px}button,select,input{margin:5px;padding:10px;border:1px solid #777;border-radius:7px;background:#333;color:#fff;font-size:15px}button{cursor:pointer;touch-action:none}button:hover{background:#505050;border-color:#ffb52e}#status{min-height:24px;margin-top:10px;color:#ffcf70;overflow-wrap:anywhere}#javatari-screen{width:min(900px,96vw);height: min(675px,72vw);min-height:300px;margin:16px auto;background:#000;border:4px solid #555;border-radius:8px;overflow:hidden}.controls{display:grid;grid-template-columns:1fr 1fr;gap:20px;width:min(500px,96vw);margin:15px auto}.dpad{display:grid;grid-template-columns:repeat(3,58px);grid-template-rows:repeat(3,52px);gap:4px;justify-content:center}.pad{font-size:23px;font-weight:bold}.blank{visibility:hidden}#fire{width:100px;height:100px;margin:auto;border:3px solid #ff7777;border-radius:50%;background:#b51e2b;font-weight:bold}.help{max-width:850px;margin:16px auto;color:#ccc;font-size:14px;line-height:1.7}label{display:inline-block;margin:6px}
</style>
<script>window.Javatari=window.Javatari||{};Javatari.SCREEN_ELEMENT_ID='javatari-screen';Javatari.AUTO_START=true;Javatari.SCREEN_CONTROL_BAR=1;</script>
<script src="https://raw.githubusercontent.com/ppeccin/javatari.js/master/release/stable/5.0/embedded/javatari.js" onerror="window.__javatariLoadFailed=true"></script>
</head><body>
<h1>ATARI 2600 — TOLIS EDITION</h1>
<div class="panel">
<div><label for="rom-folder">Επίλεξε τον φάκελο ROMS από τον υπολογιστή:</label><input id="rom-folder" type="file" webkitdirectory directory multiple></div>
<div><label for="rom-list">Παιχνίδια που βρέθηκαν:</label><select id="rom-list"><option value="">Πρώτα επίλεξε τον φάκελο ROMS</option></select><button id="load-folder">LOAD ROM</button></div>
<div><label for="rom-file">Ή επίλεξε ένα ROM απευθείας:</label><input id="rom-file" type="file" accept=".bin,.rom,.a26,.zip,.gz"></div>
<div><button id="reset">RESET</button><button id="release">RELEASE CONTROLS</button></div><div id="status">Φόρτωση πυρήνα Javatari…</div>
</div>
<div id="javatari-screen"></div>
<div class="controls"><div class="dpad"><button class="blank"> </button><button class="pad" data-key="ArrowUp">▲</button><button class="blank"> </button><button class="pad" data-key="ArrowLeft">◀</button><button class="blank">●</button><button class="pad" data-key="ArrowRight">▶</button><button class="blank"> </button><button class="pad" data-key="ArrowDown">▼</button><button class="blank"> </button></div><div style="display:flex;justify-content:center;align-items:center"><button id="fire" data-key=" ">FIRE</button></div></div>
<div class="help"><b>Πληκτρολόγιο:</b> βελάκια = κίνηση, Space = FIRE.<br><b>Χειριστήριο:</b> D-pad/αριστερός μοχλός = κίνηση, κουμπί 0 = FIRE.<br>Ο πυρήνας Javatari χρειάζεται σύνδεση Internet.</div>
<script>
(()=>{'use strict';
const status=document.getElementById('status'),list=document.getElementById('rom-list'),folder=document.getElementById('rom-folder');
const files=new Map();const keyCodes={'ArrowLeft':37,'ArrowUp':38,'ArrowRight':39,'ArrowDown':40,' ':32,'F1':112};
function say(s){status.textContent=s}
function ready(){return !!(window.Javatari&&Javatari.room&&Javatari.room.fileLoader&&typeof Javatari.room.fileLoader.loadFromContent==='function'&&Javatari.room.consoleControls)}
async function waitReady(){for(let i=0;i<200;i++){if(ready())return true;if(window.__javatariLoadFailed)return false;await new Promise(r=>setTimeout(r,100))}return false}
async function loadRom(name,buffer){say('Φόρτωση '+name+'…');if(!(await waitReady())){say('Δεν φορτώθηκε ο πυρήνας Javatari. Έλεγξε Internet και άνοιξε DevTools > Console για το σφάλμα φόρτωσης.');return}const bytes=new Uint8Array(buffer);let binary='';for(let i=0;i<bytes.length;i+=16384)binary+=String.fromCharCode.apply(null,bytes.subarray(i,Math.min(i+16384,bytes.length)));try{Javatari.room.fileLoader.loadFromContent(name,binary,'ROM',0,true,false);say('Στάλθηκε για φόρτωση: '+name+' ('+bytes.length+' bytes). Αν δεν ξεκινήσει, το ROM ίσως δεν υποστηρίζεται ή έχει μη έγκυρο format.')}catch(e){say('Σφάλμα φόρτωσης ROM: '+e.message)}}
folder.addEventListener('change',()=>{files.clear();list.innerHTML='<option value="">-- Επίλεξε παιχνίδι --</option>';Array.from(folder.files).filter(f=>/\.(bin|rom|a26|zip|gz)$/i.test(f.name)).sort((a,b)=>a.name.localeCompare(b.name)).forEach((f,i)=>{files.set(String(i),f);const o=document.createElement('option');o.value=String(i);o.textContent=f.webkitRelativePath||f.name;list.appendChild(o)});say('Βρέθηκαν '+files.size+' πιθανά ROM αρχεία. Επίλεξε ένα και πάτησε LOAD ROM.')});
document.getElementById('load-folder').addEventListener('click',async()=>{const f=files.get(list.value);if(!f){say('Επίλεξε πρώτα τον φάκελο και μετά ένα παιχνίδι.');return}try{await loadRom(f.name,await f.arrayBuffer())}catch(e){say('Αποτυχία ανάγνωσης: '+e.message)}});
document.getElementById('rom-file').addEventListener('change',async e=>{const f=e.target.files&&e.target.files[0];if(!f)return;try{await loadRom(f.name,await f.arrayBuffer())}catch(err){say('Αποτυχία ανάγνωσης: '+err.message)}});
const held=new Set();function sendKey(key,down){if(!ready())return;const code=keyCodes[key];if(!code)return;const ev={key,code,keyCode:code,which:code,preventDefault(){},stopPropagation(){},returnValue:true};try{if(down)Javatari.room.consoleControls.keyDown(ev);else Javatari.room.consoleControls.keyUp(ev)}catch(e){say('Σφάλμα χειρισμού: '+e.message)}}function press(k){if(held.has(k))return;held.add(k);sendKey(k,true)}function release(k){if(!held.has(k))return;held.delete(k);sendKey(k,false)}
document.querySelectorAll('[data-key]').forEach(b=>{const k=b.dataset.key;b.addEventListener('pointerdown',e=>{e.preventDefault();try{b.setPointerCapture(e.pointerId)}catch(_){}press(k)});['pointerup','pointercancel','lostpointercapture'].forEach(t=>b.addEventListener(t,()=>release(k)));b.addEventListener('contextmenu',e=>e.preventDefault())});document.getElementById('release').addEventListener('click',()=>Array.from(held).forEach(release));window.addEventListener('blur',()=>Array.from(held).forEach(release));document.getElementById('reset').addEventListener('click',()=>{if(ready()&&Javatari.room.consoleControls){press('F1');setTimeout(()=>release('F1'),100)}});
let prev=new Set();function pollPad(){const pads=navigator.getGamepads?navigator.getGamepads():[];const p=Array.from(pads).find(Boolean),now=new Set();if(p){const a=p.axes||[],b=p.buttons||[];if((b[14]&&b[14].pressed)||a[0]<-.5)now.add('ArrowLeft');if((b[15]&&b[15].pressed)||a[0]>.5)now.add('ArrowRight');if((b[12]&&b[12].pressed)||a[1]<-.5)now.add('ArrowUp');if((b[13]&&b[13].pressed)||a[1]>.5)now.add('ArrowDown');if(b[0]&&b[0].pressed)now.add(' ')}now.forEach(k=>{if(!prev.has(k))press(k)});prev.forEach(k=>{if(!now.has(k))release(k)});prev=now;requestAnimationFrame(pollPad)}requestAnimationFrame(pollPad);
setTimeout(()=>{if(ready())say('Javatari έτοιμο. Επίλεξε φάκελο ROMS ή μεμονωμένο ROM.');else if(window.__javatariLoadFailed)say('Αποτυχία λήψης Javatari από GitHub Raw. Έλεγξε σύνδεση ή αποκλεισμό από antivirus.');else say('Ο πυρήνας δεν έχει αρχικοποιηθεί ακόμα. Αν μείνει έτσι, άνοιξε DevTools > Console και έλεγξε το σφάλμα.');},3000);
})();
</script></body></html>
