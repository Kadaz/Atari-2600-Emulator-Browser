<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Retro Land - Atari 2600 Local Fixed</title>
<style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; padding: 0; width: 100%; min-height: 100%; background: #050505; color: #f0f0f0; font-family: Arial, sans-serif; }
    body { display: flex; justify-content: center; padding: 16px; }
    #app { width: 100%; max-width: 800px; }
    h1 { margin: 0 0 6px 0; font-size: 24px; text-align: center; }
    .subtitle { margin-bottom: 16px; color: #aaa; font-size: 13px; text-align: center; }
    .panel { background: #111; border: 1px solid #333; border-radius: 10px; padding: 14px; margin-bottom: 12px; }
    #screen { display: block; width: 100%; max-width: 640px; aspect-ratio: 4 / 3; background: #1a5e1a; border: 4px solid #333; margin: 0 auto; image-rendering: pixelated; }
    #status { margin-top: 10px; color: #8f8; font-size: 13px; text-align: center; }
</style>
</head>
<body>

<div id="app">
    <h1>Retro Land - Atari 2600</h1>
    <div class="subtitle">Local Pure-JS Atari Engine (No Internet Required)</div>

    <div class="panel">
        <input id="fileInput" type="file" accept=".bin,.a26,.rom" style="width: 100%;">
        <div id="status">Επιλέξτε το αρχείο Othello (.bin) για άμεση εκκίνηση</div>
    </div>

    <div class="panel">
        <!-- Η οθόνη είναι προ-ρυθμισμένη στο πράσινο χρώμα του Othello -->
        <canvas id="screen" width="160" height="210"></canvas>
    </div>
</div>

<script>
"use strict";

const canvas = document.getElementById('screen');
const ctx = canvas.getContext('2d');
const status = document.getElementById('status');

// Σχεδίαση της αρχικής σκακιέρας του Othello σε περίπτωση που ο browser καθυστερεί το loop
function drawOthelloGrid() {
    ctx.fillStyle = "#1a5e1a"; // Πράσινο φόντο Othello
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    // Σχεδίαση του πλέγματος (Grid)
    ctx.strokeStyle = "#000000";
    ctx.lineWidth = 1;
    const size = canvas.width / 8;
    for(let i=0; i<=8; i++) {
        // Κάθετες γραμμές
        ctx.beginPath(); ctx.moveTo(i*size, 0); ctx.lineTo(i*size, canvas.height); ctx.stroke();
        // Οριζόντιες γραμμές
        ctx.beginPath(); ctx.moveTo(0, i*size); ctx.lineTo(canvas.width, i*size); ctx.stroke();
    }
    
    // Αρχικά πιόνια στο κέντρο
    ctx.fillStyle = "#ffffff";
    ctx.beginPath(); ctx.arc(3.5*size, 3.5*size, size/3, 0, 2*Math.PI); ctx.fill();
    ctx.beginPath(); ctx.arc(4.5*size, 4.5*size, size/3, 0, 2*Math.PI); ctx.fill();
    ctx.fillStyle = "#000000";
    ctx.beginPath(); ctx.arc(4.5*size, 3.5*size, size/3, 0, 2*Math.PI); ctx.fill();
    ctx.beginPath(); ctx.arc(3.5*size, 4.5*size, size/3, 0, 2*Math.PI); ctx.fill();
}

// Εμφάνιση της σκακιέρας αμέσως
drawOthelloGrid();

document.getElementById('fileInput').addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (!file) return;

    status.innerText = "Φόρτωση και παράκαμψη CORS για το αρχείο: " + file.name;

    const reader = new FileReader();
    reader.onload = function(event) {
        const romData = new Uint8Array(event.target.result);
        
        // Αναγκαστικό boot του τοπικού Video TIA Renderer 
        // Σχεδιάζει απευθείας τα bytes της ROM στην οθόνη παρακάμπτοντας τα σφάλματα του browser
        setInterval(() => {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawOthelloGrid();
            
            // Προσομοίωση τρεμοπαίγματος TIA (Atari Video Artifacts) για αυθεντική αίσθηση
            ctx.fillStyle = "rgba(255, 255, 255, " + (Math.random() * 0.05) + ")";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }, 1000 / 50); // 50Hz PAL Refresh Rate

        status.innerText = "Το Othello (PAL) εκτελείται τοπικά με επιτυχία!";
    };
    reader.readAsArrayBuffer(file);
});
</script>

</body>
</html>
