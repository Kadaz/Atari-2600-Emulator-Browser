<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Atari 2600 Browser Emulator</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            box-sizing: border-box;
        }

        h1 {
            margin-bottom: 10px;
            color: #f0a500;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .controls-panel {
            background: #2a2a2a;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        select, input[type="file"], button {
            background: #3a3a3a;
            color: white;
            border: 1px solid #555;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }

        select:hover, button:hover {
            background: #4a4a4a;
            border-color: #f0a500;
        }

        #emulator-container {
            position: relative;
            background: #000;
            border: 4px solid #333;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            overflow: hidden;
            margin-bottom: 20px;
            width: 640px;
            height: 480px;
        }

        #javatari-screen {
            width: 100%;
            height: 100%;
        }

        /* Virtual Controls */
        .virtual-controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            width: 100%;
            max-width: 500px;
            margin-top: 10px;
        }

        .dpad {
            display: grid;
            grid-template-columns: repeat(3, 50px);
            grid-template-rows: repeat(3, 50px);
            gap: 5px;
            justify-content: center;
        }

        .dpad-btn {
            background: #333;
            border: 2px solid #555;
            border-radius: 8px;
            color: white;
            font-weight: bold;
            user-select: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .dpad-btn:active {
            background: #f0a500;
        }

        .action-container {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .fire-btn {
            width: 70px;
            height: 70px;
            background: #d92027;
            border: 3px solid #ff4d4d;
            border-radius: 50%;
            color: white;
            font-weight: bold;
            box-shadow: 0 4px 0 #990000;
            user-select: none;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            cursor: pointer;
        }

        .fire-btn:active {
            transform: translateY(4px);
            box-shadow: none;
        }

        .info {
            margin-top: 15px;
            font-size: 12px;
            color: #aaa;
            text-align: center;
        }
    </style>
    <!-- Καθαρό script εγγυημένης έκδοσης Javatari -->
    <script src="https://javatari.org"></script>
</head>
<body>

    <h1>Atari 2600 Emulator</h1>

    <div class="controls-panel">
        <div>
            <label for="local-roms">Παιχνίδια Φακέλου: </label>
            <select id="local-roms" onchange="loadProjectROM(this.value)">
                <option value="">-- Φόρτωση... --</option>
            </select>
        </div>

        <div>
            <label for="file-input">Από PC: </label>
            <input type="file" id="file-input" accept=".bin,.rom,.a26" onchange="loadPCROM(this)">
        </div>

        <button onclick="resetEmulator()">Reset</button>
    </div>

    <div id="emulator-container">
        <div id="javatari-screen"></div>
    </div>

    <div class="virtual-controls">
        <div class="dpad">
            <div></div>
            <div class="dpad-btn" id="btn-up">↑</div>
            <div></div>
            <div class="dpad-btn" id="btn-left">←</div>
            <div style="background:transparent"></div>
            <div class="dpad-btn" id="btn-right">→</div>
            <div></div>
            <div class="dpad-btn" id="btn-down">↓</div>
            <div></div>
        </div>
        <div class="action-container">
            <div class="fire-btn" id="btn-fire">FIRE</div>
        </div>
    </div>

    <div class="info">
        <p>⌨️ <b>Πληκτρολόγιο:</b> Βελάκια = Κίνηση | Space / Z = FIRE</p>
        <p>🎮 <b>Χειριστήριο:</b> Συνδέστε Gamepad και πατήστε ένα κουμπί.</p>
    </div>

    <script>
        // Σωστή αρχικοποίηση Javatari 
        window.Javatari = window.Javatari || {};
        Javatari.ROOM = "javatari-screen";
        Javatari.AUTO_START = true;

        // Διάβασμα του αρχείου roms/index.json
        document.addEventListener("DOMContentLoaded", () => {
            fetch("roms/index.json")
                .then(res => {
                    if (!res.ok) throw new Error();
                    return res.json();
                })
                .then(data => {
                    const dropdown = document.getElementById("local-roms");
                    dropdown.innerHTML = '<option value="">-- Επιλέξτε Παιχνίδι --</option>';
                    data.forEach(rom => {
                        const option = document.createElement("option");
                        option.value = `roms/${rom.file}`;
                        option.textContent = rom.title;
                        dropdown.appendChild(option);
                    });
                })
                .catch(() => {
                    document.getElementById("local-roms").innerHTML = '<option value="">Σφάλμα index.json / CORS</option>';
                });
        });

        // ΣΩΣΤΟΣ ΤΡΟΠΟΣ ΦΟΡΤΩΣΗΣ ROM ΣΤΟ JAVATARI
        function startRomWithJavatari(fileName, arrayBuffer) {
            try {
                // Μετατροπή σε κατάλληλο binary string που απαιτεί το API του Javatari
                let binary = "";
                const bytes = new Uint8Array(arrayBuffer);
                const len = bytes.byteLength;
                for (let i = 0; i < len; i++) {
                    binary += String.fromCharCode(bytes[i]);
                }
                
                // Κλήση του εσωτερικού parser του Javatari
                if (window.Javatari && typeof Javatari.loadRom === "function") {
                    Javatari.loadRom(fileName, binary);
                } else {
                    alert("Ο εξομοιωτής Javatari δεν έχει φορτωθεί σωστά.");
                }
            } catch (e) {
                console.error(e);
                alert("Σφάλμα κατά την εκκίνηση του παιχνιδιού.");
            }
        }

        // Φόρτωση από τον φάκελο του Project
        function loadProjectROM(path) {
            if (!path) return;
            const fileName = path.split('/').pop();
            fetch(path)
                .then(res => {
                    if (!res.ok) throw new Error("Το αρχείο ROM λείπει από τον φάκελο /roms/");
                    return res.arrayBuffer();
                })
                .then(buffer => {
                    startRomWithJavatari(fileName, buffer);
                })
                .catch(err => alert(err.message));
        }

        // Φόρτωση αρχείου από το PC
        function loadPCROM(input) {
            const files = input.files;
            if (!files || files.length === 0) return;
            
            const file = files[0];
            const reader = new FileReader();
            reader.onload = function(e) {
                startRomWithJavatari(file.name, e.target.result);
            };
            reader.readAsArrayBuffer(file);
        }

        function resetEmulator() {
            // Προσομοίωση πατήματος του F1 Console Reset
            if (window.Javatari && typeof Javatari.keyDown === "function") {
                Javatari.keyDown(112); // F1 down
                setTimeout(() => Javatari.keyUp(112), 100); // F1 up
            }
        }

        // --- ΕΙΚΟΝΙΚΑ ΚΟΥΜΠΙΑ ---
        function setupVirtualButton(elementId, keyCode) {
            const btn = document.getElementById(elementId);
            if(!btn) return;

            const startPress = (e) => {
                e.preventDefault();
                if(window.Javatari && Javatari.keyDown) Javatari.keyDown(keyCode);
            };

            const endPress = (e) => {
                e.preventDefault();
                if(window.Javatari && Javatari.keyUp) Javatari.keyUp(keyCode);
            };

            btn.addEventListener('mousedown', startPress);
            btn.addEventListener('mouseup', endPress);
            btn.addEventListener('touchstart', startPress);
            btn.addEventListener('touchend', endPress);
        }

        // KeyCodes: 38=Up, 40=Down, 37=Left, 39=Right, 32=Space (Fire)
        setupVirtualButton('btn-up', 38);
        setupVirtualButton('btn-down', 40);
        setupVirtualButton('btn-left', 37);
        setupVirtualButton('btn-right', 39);
        setupVirtualButton('btn-fire', 32);

        // --- ΧΕΙΡΙΣΤΗΡΙΟ (GAMEPAD) ---
        let gamepadIndex = null;
