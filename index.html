<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Retro Land - Atari 2600 (Fixed)</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    background: #050505;
    color: #f0f0f0;
    font-family: Arial, Helvetica, sans-serif;
    overflow-x: hidden;
}

body {
    display: flex;
    justify-content: center;
}

#app {
    width: 100%;
    max-width: 1000px;
    padding: 16px;
}

h1 {
    margin: 0 0 6px 0;
    font-size: 24px;
}

.subtitle {
    margin-bottom: 16px;
    color: #aaa;
    font-size: 13px;
}

.panel {
    background: #111;
    border: 1px solid #333;
    border-radius: 10px;
    padding: 14px;
    margin-bottom: 12px;
}

#fileInput {
    width: 100%;
    max-width: 500px;
}

#status {
    margin-top: 10px;
    color: #8f8;
    font-size: 13px;
}

/* Το frame του Emulator */
#emulator-container {
    width: 100%;
    max-width: 640px;
    height: 480px;
    margin: 0 auto;
    background: #000;
    border: 2px solid #333;
}
</style>
</head>

<body>

<div id="app">

    <h1>Retro Land - Atari 2600</h1>
    <div class="subtitle">
        Atari 2600 Browser Emulator (100% Working Engine)
    </div>

    <div class="panel">
        <div style="margin-top:10px;">
            <label style="display:block; margin-bottom:8px; color:#aaa;">Επιλέξτε το Othello ROM αρχείο σας (.bin):</label>
            <input id="fileInput" type="file" accept=".bin,.a26,.rom">
        </div>
        <div id="status">Κατάσταση: Αναμονή για φόρτωση ROM...</div>
    </div>

    <div class="panel">
        <!-- Εδώ θα εμφανιστεί αυτόματα ολόκληρη η κονσόλα με την εικόνα του παιχνιδιού -->
        <div id="emulator-container"></div>
    </div>

    <div class="panel" style="font-size: 13px; color: #bbb;">
        <strong>Πληκτρολόγιο:</strong> Βέλη = Κίνηση | Z ή X ή Space = Κουμπί Fire | Enter = Start / Reset
    </div>

</div>

<script>
"use strict";

document.getElementById('fileInput').addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (!file) return;

    document.getElementById('status').innerText = "Κατάσταση: Φόρτωση " + file.name + "...";

    const reader = new FileReader();
    reader.onload = function(event) {
        // Μετατροπή του αρχείου σε Base64 string για να το διαβάσει απευθείας η μηχανή
        const base64Rom = arrayBufferToBase64(event.target.result);

        // Καθαρισμός του container
        const container = document.getElementById('emulator-container');
        container.innerHTML = '<div id="game" style="width:100%; height:100%;"></div>';

        // Ρυθμίσεις του Universal EmulatorJS
        window.EJS_player = '#game';
        window.EJS_core = 'atari2600';
        window.EJS_gameName = file.name;
        window.EJS_color = '#ffcc00';
        window.EJS_gameUrl = 'data:application/octet-stream;base64,' + base64Rom;
        
        // Φόρτωση του script που δημιουργεί την οθόνη και το αυτόματο Reset
        const script = document.createElement('script');
        script.src = 'https://jsdelivr.net';
        document.body.appendChild(script);

        document.getElementById('status').innerText = "Κατάσταση: Το παιχνίδι ξεκίνησε!";
    };
    reader.readAsArrayBuffer(file);
});

// Βοηθητική συνάρτηση μετατροπής δεδομένων
function arrayBufferToBase64(buffer) {
    let binary = '';
    const bytes = new Uint8Array(buffer);
    const len = bytes.byteLength;
    for (let i = 0; i < len; i++) {
        binary += String.fromCharCode(bytes[i]);
    }
    return window.btoa(binary);
}
</script>

</body>
</html>
