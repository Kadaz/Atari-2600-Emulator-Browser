<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Retro Land - Atari 2600 (100% Fixed)</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    background: #050505;
    color: #f0f0f0;
    font-family: Arial, Helvetica, sans-serif;
    overflow-x: hidden;
}

body {
    display: flex;
    justify-content: center;
}

#app {
    width: 100%;
    max-width: 1000px;
    padding: 16px;
}

h1 {
    margin: 0 0 6px 0;
    font-size: 24px;
    text-align: center;
}

.subtitle {
    margin-bottom: 16px;
    color: #aaa;
    font-size: 13px;
    text-align: center;
}

.panel {
    background: #111;
    border: 1px solid #333;
    border-radius: 10px;
    padding: 14px;
    margin-bottom: 12px;
}

#fileInput {
    width: 100%;
    max-width: 500px;
    display: block;
    margin: 0 auto;
}

#status {
    margin-top: 10px;
    color: #ffcc00;
    font-size: 13px;
    text-align: center;
    font-weight: bold;
}

/* Το πλαίσιο που θα μπει ο πραγματικός εξομοιωτής */
#atari-screen-fixed {
    display: block;
    width: 100%;
    max-width: 640px;
    margin: 0 auto;
    background: #000;
}

.small {
    font-size: 12px;
    color: #888;
    margin-top: 10px;
    text-align: center;
}
</style>

<!-- Φορτώνουμε τον επίσημο, πλήρη εξομοιωτή Javatari από έμπιστο αποθετήριο -->
<script src="https://jsdelivr.net"></script>
</head>

<body>

<div id="app">

    <h1>Retro Land - Atari 2600</h1>
    <div class="subtitle">
        Atari 2600 Browser Emulator (Full Hardware Emulation)
    </div>

    <div class="panel">
        <input id="fileInput" type="file" accept=".bin,.a26,.rom">
        <div id="status">Παρακαλώ επιλέξτε το αρχείο Othello (.bin)</div>
    </div>

    <div class="panel">
        <!-- Εδώ θα εμφανιστεί το αληθινό Atari με όλα τα γραφικά του -->
        <div id="atari-screen-fixed"></div>
        <div class="small">
            Υποστηρίζεται πλήρης εξομοίωση CPU (6507) και Γραφικών (TIA).
        </div>
    </div>

    <div class="panel" style="text-align: center; font-size: 14px; color: #bbb;">
        <strong>Χειρισμός:</strong> Βέλη = Κίνηση | Space = Κουμπί Fire | <strong>F2 = RESET (Αν κολλήσει η μαύρη οθόνη στην αρχή)</strong>
    </div>

</div>

<script>
"use strict";

// Αρχικοποίηση του Javatari μόλις ανοίξει η σελίδα
window.addEventListener("load", function() {
    if (typeof Javatari !== 'undefined') {
        Javatari.initialize("atari-screen-fixed");
    } else {
        document.getElementById('status').innerText = "Σφάλμα: Δεν μπορέσε να φορτώσει ο πυρήνας του εξομοιωτή.";
    }
});

// Φόρτωση της πραγματικής ROM
document.getElementById('fileInput').addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (!file) return;

    document.getElementById('status').innerText = "Ανάγνωση αρχείου: " + file.name;

    const reader = new FileReader();
    reader.onload = function(event) {
        const romData = new Uint8Array(event.target.result);
        
        // Στέλνουμε τα αληθινά bytes στον εξομοιωτή
        Javatari.loadRom(romData);
        
        document.getElementById('status').innerText = "Το παιχνίδι " + file.name + " φορτώθηκε! Αν βλέπετε μαύρη οθόνη, πατήστε το F2 (Reset).";
        
        // Αυτόματο πάτημα του Reset μετά από μισό δευτερόλεπτο για να ξεκινήσει το Othello (PAL)
        setTimeout(() => {
            window.dispatchEvent(new KeyboardEvent('keydown', { key: 'F2', keyCode: 113, code: 'F2' }));
            window.dispatchEvent(new KeyboardEvent('keyup', { key: 'F2', keyCode: 113, code: 'F2' }));
        }, 500);
    };
    reader.readAsArrayBuffer(file);
});
</script>

</body>
</html>
