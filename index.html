
<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simple Atari 2600</title>
<style>
body{margin:0;background:#17191d;color:#eee;font:16px Arial;text-align:center;padding:20px}
main{max-width:760px;margin:auto}
canvas{display:block;width:100%;max-width:640px;aspect-ratio:4/3;height:auto;background:#000;border:3px solid #555;margin:20px auto;image-rendering:pixelated}
button,input{margin:5px;padding:10px;background:#303640;color:white;border:1px solid #687080;border-radius:5px}
#status{color:#9fd0ff;min-height:24px}
</style>
</head>
<body>
<main>
<h1>Atari 2600 Browser</h1>
<p>Επίλεξε ROM Atari 2600 2 KB ή 4 KB.</p>
<input id="romfile" type="file" accept=".bin,.rom,.a26">
<button id="reset">Reset</button>
<canvas id="screen" width="160" height="192"></canvas>
<div id="status">Δεν έχει φορτωθεί ROM.</div>
<p>Πληκτρολόγιο: βελάκια = joystick, Space = fire, Enter = reset, P = pause.</p>
</main>
<script>
"use strict";

const canvas=document.getElementById("screen");
const ctx=canvas.getContext("2d");
const status=document.getElementById("status");
const pixels=ctx.createImageData(160,192);
let rom=null,paused=true,raf=0;
const ram=new Uint8Array(128);
const tia=new Uint8Array(64);
const riot=new Uint8Array(32);
const keys=new Set();

const palette=[
"#000000","#404040","#6c6c6c","#909090",
"#b0b0b0","#c8c8c8","#dcdcdc","#eeeeee",
"#400000","#641010","#842020","#a43030",
"#c44040","#dc5858","#f07878","#fc9c9c",
"#4c1c00","#702c00","#943c00","#b44c00",
"#d46000","#e87800","#f89418","#fcb44c",
"#483000","#6c4800","#906000","#b07800",
"#cc9000","#e0a818","#f0c048","#fcd880",
"#3c3c00","#5c5c00","#7c7c00","#9c9c00",
"#b8b800","#d0d020","#e4e44c","#f4f484",
"#184400","#286400","#388400","#48a400",
"#58c000","#70d818","#90ec48","#b0f880",
"#004810","#006c18","#009020","#00b030",
"#00cc40","#18e058","#48f078","#80fca4",
"#004048","#006070","#0080a0","#00a0c0",
"#18c0e0","#48d8f0","#80f0fc","#000060",
"#000080","#0000a0","#2020c0","#4040e0",
"#7070f0","#a0a0ff","#d0d0ff","#300060",
"#500080","#7020a0","#9040c0","#b060e0",
"#d080f0","#e8b0ff","#600040","#800060",
"#a02080","#c040a0","#e060c0","#f090d8"
];

function rgb(value){
  const i=(value>>>1)%palette.length;
  const h=palette[i]||"#000000";
  return [
    parseInt(h.slice(1,3),16),
    parseInt(h.slice(3,5),16),
    parseInt(h.slice(5,7),16)
  ];
}

function pixel(x,y,c){
  if(x<0||x>=160||y<0||y>=192)return;
  const i=(y*160+x)*4;
  pixels.data[i]=c[0];
  pixels.data[i+1]=c[1];
  pixels.data[i+2]=c[2];
  pixels.data[i+3]=255;
}

function renderLine(y){
  const bg=rgb(tia[9]);
  const pf=rgb(tia[8]);
  const p0=rgb(tia[6]);
  const p1=rgb(tia[7]);

  for(let x=0;x<160;x++){
    let c=bg;
    let px=x<80?x:159-x;
    let bit=Math.floor(px/4)%20;
    let on=0;

    if(bit<4) on=(tia[13]>>(x<80?4+bit:bit))&1;
    else if(bit<12) on=(tia[14]>>(x<80?bit-4:11-bit))&1;
    else on=(tia[15]>>(x<80?bit-12:19-bit))&1;

    if(on)c=pf;

    const x0=(tia[2]+3)%160;
    const x1=(tia[3]+3)%160;

    if(x>=x0&&x<x0+8)c=p0;
    if(x>=x1&&x<x1+8)c=p1;

    pixel(x,y,c);
  }
}

function draw(){
  ctx.putImageData(pixels,0,0);
}

function read(address){
  address &= 0x1fff;

  if(address<0x80){
    return tia[address&0x3f]||0;
  }

  if(address<0x100){
    return ram[address&0x7f];
  }

  if(address>=0x280&&address<0x300){
    return riot[address&31]||0;
  }

  if(address>=0x1000&&rom){
    let i=address&0xfff;
    if(rom.length===2048)i&=0x7ff;
    return rom[i%rom.length];
  }

  return 0;
}

function write(address,value){
  address &= 0x1fff;
  value &= 255;

  if(address<0x80){
    tia[address&0x3f]=value;
    return;
  }

  if(address<0x100){
    ram[address&0x7f]=value;
    return;
  }

  if(address>=0x280&&address<0x300){
    riot[address&31]=value;
  }
}

class CPU6507{
  constructor(){this.reset()}

  reset(){
    this.a=0;
    this.x=0;
    this.y=0;
    this.sp=0xfd;
    this.p=0x24;
    this.pc=read(0x1ffc)|(read(0x1ffd)<<8);
    if(!this.pc||this.pc===0xffff)this.pc=0xf000;
    this.stopped=false;
  }

  fetch(){
    const v=read(this.pc);
    this.pc=(this.pc+1)&0xffff;
    return v;
  }

  word(){
    const lo=this.fetch();
    return lo|(this.fetch()<<8);
  }

  flag(bit,on){
    this.p=on?this.p|bit:this.p&~bit;
  }

  nz(v){
    v&=255;
    this.flag(2,v===0);
    this.flag(128,!!(v&128));
    return v;
  }

  push(v){
    write(0x100+this.sp,v);
    this.sp=(this.sp-1)&255;
  }

  pop(){
    this.sp=(this.sp+1)&255;
    return read(0x100+this.sp);
  }

  addr(mode){
    if(mode==="zp")return this.fetch();
    if(mode==="zpx")return (this.fetch()+this.x)&255;
    if(mode==="zpy")return (this.fetch()+this.y)&255;
    if(mode==="abs")return this.word();
    if(mode==="abx")return (this.word()+this.x)&65535;
    if(mode==="aby")return (this.word()+this.y)&65535;
    if(mode==="izx"){
      const z=(this.fetch()+this.x)&255;
      return read(z)|(read((z+1)&255)<<8);
    }
    if(mode==="izy"){
      const z=this.fetch();
      return ((read(z)|(read((z+1)&255)<<8))+this.y)&65535;
    }
    return 0;
  }

  adc(v){
    const sum=this.a+v+(this.p&1);
    this.flag(1,sum>255);
    this.flag(64,!!((~(this.a^v)&(this.a^sum))&128));
    this.a=this.nz(sum);
  }

  step(){
    const op=this.fetch();
    let v,a,t,addr,mode,cycles=2;

    switch(op){
      case 0x00:
        this.pc++;
        this.push(this.pc>>8);
        this.push(this.pc&255);
        this.push(this.p|0x30);
        this.flag(4,true);
        this.pc=read(0x1ffe)|(read(0x1fff)<<8);
        cycles=7;
        break;

      case 0xea:break;

      case 0xa9:this.a=this.nz(this.fetch());break;
      case 0xa2:this.x=this.nz(this.fetch());break;
      case 0xa0:this.y=this.nz(this.fetch());break;

      case 0xa5:this.a=this.nz(read(this.addr("zp")));cycles=3;break;
      case 0xad:this.a=this.nz(read(this.addr("abs")));cycles=4;break;
      case 0xb5:this.a=this.nz(read(this.addr("zpx")));cycles=4;break;
      case 0xbd:this.a=this.nz(read(this.addr("abx")));cycles=4;break;
      case 0xb9:this.a=this.nz(read(this.addr("aby")));cycles=4;break;

      case 0xa6:this.x=this.nz(read(this.addr("zp")));cycles=3;break;
      case 0xae:this.x=this.nz(read(this.addr("abs")));cycles=4;break;
      case 0xa4:this.y=this.nz(read(this.addr("zp")));cycles=3;break;
      case 0xac:this.y=this.nz(read(this.addr("abs")));cycles=4;break;

      case 0x85:write(this.addr("zp"),this.a);cycles=3;break;
      case 0x8d:write(this.addr("abs"),this.a);cycles=4;break;
      case 0x95:write(this.addr("zpx"),this.a);cycles=4;break;
      case 0x9d:write(this.addr("abx"),this.a);cycles=5;break;
      case 0x99:write(this.addr("aby"),this.a);cycles=5;break;
      case 0x86:write(this.addr("zp"),this.x);cycles=3;break;
      case 0x8e:write(this.addr("abs"),this.x);cycles=4;break;
      case 0x84:write(this.addr("zp"),this.y);cycles=3;break;
      case 0x8c:write(this.addr("abs"),this.y);cycles=4;break;

      case 0xaa:this.x=this.nz(this.a);break;
      case 0x8a:this.a=this.nz(this.x);break;
      case 0xa8:this.y=this.nz(this.a);break;
      case 0x98:this.a=this.nz(this.y);break;

      case 0xe8:this.x=this.nz(this.x+1);break;
      case 0xca:this.x=this.nz(this.x-1);break;
      case 0xc8:this.y=this.nz(this.y+1);break;
      case 0x88:this.y=this.nz(this.y-1);break;

      case 0x18:this.flag(1,false);break;
      case 0x38:this.flag(1,true);break;
      case 0x58:this.flag(4,false);break;
      case 0x78:this.flag(4,true);break;
      case 0xb8:this.flag(64,false);break;
      case 0xd8:this.flag(8,false);break;
      case 0xf8:this.flag(8,true);break;

      case 0x69:this.adc(this.fetch());break;
      case 0xe9:this.adc(this.fetch()^255);break;
      case 0x29:this.a=this.nz(this.a&this.fetch());break;
      case 0x09:this.a=this.nz(this.a|this.fetch());break;
      case 0x49:this.a=this.nz(this.a^this.fetch());break;

      case 0xc9:
        v=this.fetch();t=(this.a-v)&255;
        this.flag(1,this.a>=v);this.nz(t);break;
      case 0xe0:
        v=this.fetch();this.flag(1,this.x>=v);this.nz(this.x-v);break;
      case 0xc0:
        v=this.fetch();this.flag(1,this.y>=v);this.nz(this.y-v);break;

      case 0x4c:this.pc=this.word();cycles=3;break;
      case 0x20:
        addr=this.word();
        this.push((this.pc-1)>>8);
        this.push((this.pc-1)&255);
        this.pc=addr;cycles=6;break;
      case 0x60:
        this.pc=((this.pop()|(this.pop()<<8))+1)&65535;
        cycles=6;break;
      case 0x40:
        this.p=(this.pop()&~16)|32;
        this.pc=this.pop()|(this.pop()<<8);
        cycles=6;break;

      case 0x48:this.push(this.a);cycles=3;break;
      case 0x68:this.a=this.nz(this.pop());cycles=4;break;
      case 0x08:this.push(this.p|48);cycles=3;break;
      case 0x28:this.p=(this.pop()&~16)|32;cycles=4;break;

      case 0x10:case 0x30:case 0x50:case 0x70:
      case 0x90:case 0xb0:case 0xd0:case 0xf0:
        v=this.fetch();
        let cond=
          op===0x10?!(this.p&128):
          op===0x30?!!(this.p&128):
          op===0x50?!(this.p&64):
          op===0x70?!!(this.p&64):
          op===0x90?!(this.p&1):
          op===0xb0?!!(this.p&1):
          op===0xd0?!(this.p&2):!!(this.p&2);
        if(cond){
          this.pc=(this.pc+(v<128?v:v-256))&65535;
          cycles=3;
        }
        break;

      case 0x4a:this.flag(1,!!(this.a&1));this.a=this.nz(this.a>>1);break;
      case 0x0a:this.flag(1,!!(this.a&128));this.a=this.nz(this.a<<1);break;
      case 0x6a:
        t=this.p&1;this.flag(1,!!(this.a&1));
        this.a=this.nz((this.a>>1)|(t<<7));break;
      case 0x2a:
        t=this.p&1;this.flag(1,!!(this.a&128));
        this.a=this.nz((this.a<<1)|t);break;

      case 0x02:case 0x12:case 0x22:case 0x32:
      case 0x42:case 0x52:case 0x62:case 0x72:
      case 0x92:case 0xb2:case 0xd2:case 0xf2:
        this.stopped=true;break;

      default:
        // Unimplemented opcode: skip safely, but game compatibility is limited.
        break;
    }

    tick(cycles);
  }
}

let cpu=null,scanline=0,hclock=0,frame=0;

function tick(cycles){
  for(let i=0;i<cycles*3;i++){
    hclock++;
    if(hclock>=228){
      hclock=0;
      if(scanline<192)renderLine(scanline);
      scanline++;
      if(scanline>=262){
        scanline=0;
        frame++;
        draw();
      }
    }
  }
}

function start(){
  if(!rom)return;
  ram.fill(0);tia.fill(0);riot.fill(0);
  scanline=hclock=frame=0;
  pixels.data.fill(0);
  cpu=new CPU6507();
  paused=false;
  cancelAnimationFrame(raf);
  status.textContent="ROM loaded. Basic compatibility mode.";
  raf=requestAnimationFrame(loop);
}

function loop(){
  if(paused||!cpu||!rom)return;
  let count=0;
  const startingFrame=frame;

  while(count++<12000&&!cpu.stopped&&frame===startingFrame){
    cpu.step();
  }

  if(cpu.stopped){
    paused=true;
    status.textContent="CPU stopped: ROM uses an unsupported opcode.";
  }else{
    draw();
    raf=requestAnimationFrame(loop);
  }
}

document.getElementById("romfile").addEventListener("change",async e=>{
  const f=e.target.files[0];
  if(!f)return;
  const data=new Uint8Array(await f.arrayBuffer());

  if(data.length!==2048&&data.length!==4096){
    status.textContent="Μη υποστηριζόμενο μέγεθος ROM. Χρειάζεται 2 KB ή 4 KB.";
    return;
  }

  rom=data;
  status.textContent="Loaded: "+f.name+" ("+data.length+" bytes)";
  start();
});

document.getElementById("reset").addEventListener("click",start);

window.addEventListener("keydown",e=>{
  if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"," "].includes(e.key))e.preventDefault();
  keys.add(e.key);
  if(e.key==="Enter")start();
  if(e.key.toLowerCase()==="p"){
    paused=!paused;
    if(!paused)raf=requestAnimationFrame(loop);
  }
},{passive:false});

window.addEventListener("keyup",e=>keys.delete(e.key));
})();
</script>
</body>
</html>
