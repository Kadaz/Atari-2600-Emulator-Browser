<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Browser Emulator - Atari 2600</title>
    <style>
        body {
            background-color: #111;
            color: #fff;
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        h1 { margin-bottom: 20px; }
        /* Ειδικό container για τον Atari Emulator */
        #atari-screen {
            margin: 20px auto;
            max-width: 640px;
            box-shadow: 0px 0px 20px rgba(0,0,0,0.8);
        }
        .controls-info {
            margin-top: 20px;
            color: #aaa;
            font-size: 14px;
        }
    </style>
    <!-- Φόρτωση του HTML5/JS Atari 2600 Emulator Core -->
    <script src="https://javatari.org"></script>
</head>
<body>

    <h1>Atari 2600 Emulator</h1>
    <p>Επιλέξτε ή σύρετε (Drag & Drop) το Atari ROM αρχείο σας (.bin ή .a26)</p>

    <!-- Το σημείο όπου θα εμφανιστεί η κονσόλα του Atari -->
    <div id="atari-screen"></div>

    <div class="controls-info">
        <p><strong>Χειρισμός (Πληκτρολόγιο):</strong> Βέλη = Κίνηση | Space / Alt / Ctrl = Κουμπί Fire</p>
        <p><strong>Κονσόλα:</strong> F2 = Reset | F3 = Select | F11 = Full Screen</p>
    </div>

    <script>
        // Αρχικοποίηση του Atari Emulator μόλις φορτώσει η σελίδα
        window.addEventListener("load", function() {
            Javatari.initialize("atari-screen");
            
            // Αυτόματη αναζήτηση για ROM στον φάκελό σου αν υπάρχει προκαθορισμένο αρχείο
            // Ή μπορείς απλά να σέρνεις (drag & drop) το .bin αρχείο σου πάνω στην οθόνη!
            fetch('roms/game.bin')
                .then(response => {
                    if (response.ok) return response.arrayBuffer();
                    throw new Error('No default ROM found in /roms/game.bin');
                })
                .then(buffer => {
                    const romData = new Uint8Array(buffer);
                    Javatari.loadRom(romData);
                })
                .catch(err => console.log(err.message));
        });
    </script>

</body>
</html>
