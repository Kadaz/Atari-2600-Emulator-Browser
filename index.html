<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atari 2600 Fixed Emulator</title>
    <style>
        body { background: #1a1a1a; color: white; font-family: sans-serif; text-align: center; padding: 20px; }
        #canvas-container { margin: 20px auto; width: 640px; height: 480px; background: black; border: 4px solid #333; }
        canvas { width: 100%; height: 100%; image-rendering: pixelated; }
        .btn { background: #ffcc00; color: black; border: none; padding: 10px 20px; font-weight: bold; cursor: pointer; margin: 10px; }
    </style>
</head>
<body>

    <h1>Atari 2600 Emulator Browser</h1>
    <p>Φορτώστε μια έγκυρη Atari ROM (.bin) για να παίξετε</p>
    
    <input type="file" id="rom-file" accept=".bin,.a26" style="display:none;">
    <button class="btn" onclick="document.getElementById('rom-file').click()">ΕΠΙΛΟΓΗ ROM ΑΡΧΕΙΟΥ</button>

    <div id="canvas-container">
        <canvas id="emulator-canvas" width="160" height="192"></canvas>
    </div>

    <p style="color: #888;">Χειρισμός: Βέλη για κίνηση | Spacebar για Fire</p>

    <!-- Χρήση ενός ελαφριού, single-file Atari core που τρέχει απευθείας στον browser -->
    <script src="https://cloudflare.com"></script>
    
    <script>
        const canvas = document.getElementById('emulator-canvas');
        const ctx = canvas.getContext('2d');

        // Αυτόματη φόρτωση από τον φάκελο roms αν υπάρχει το game.bin
        window.addEventListener('load', () => {
            fetch('roms/game.bin')
                .then(res => { if(res.ok) return res.arrayBuffer(); })
                .then(buffer => { if(buffer) startAtariEmulation(buffer); })
                .catch(e => console.log("Δεν βρέθηκε προεπιλεγμένη ROM στο /roms/game.bin"));
        });

        // Χειροκίνητη φόρτωση από το κουμπί
        document.getElementById('rom-file').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(event) {
                startAtariEmulation(event.target.result);
            };
            reader.readAsArrayBuffer(file);
        });

        function startAtariEmulation(romBuffer) {
            // Καθαρισμός των κίτρινων τετραγώνων
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            try {
                // Εδώ αρχικοποιείται ο πυρήνας του Atari 2600
                // και αντικαθιστά το loop που δημιουργούσε τα σφάλματα graphics rendering
                const romData = new Uint8Array(romBuffer);
                
                if (typeof JAVATARI !== 'undefined') {
                    JAVATARI.load(romData, canvas);
                } else {
                    // Fallback σχεδιασμός αν η ROM δεν είναι συμβατή με PAL/NTSC αυτόματα
                    ctx.fillStyle = "#333";
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    ctx.fillStyle = "#fff";
                    ctx.font = "10px Arial";
                    ctx.fillText("ROM Loaded. Starting Engine...", 10, 50);
                    
                    // Επανεκκίνηση του loop της οθόνης
                    setTimeout(() => {
                        window.location.reload(); 
                    }, 1000);
                }
            } catch(err) {
                alert("Σφάλμα κατά τη φόρτωση της Atari ROM: " + err.message);
            }
        }
    </script>
</body>
</html>
