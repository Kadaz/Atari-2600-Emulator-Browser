<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Atari 2600 Browser Emulator</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }

        h1 {
            color: #f0a500;
            margin-bottom: 10px;
        }

        .controls-panel {
            background: #2a2a2a;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
        }

        select, input[type="file"], button {
            background: #3a3a3a;
            color: white;
            border: 1px solid #555;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
        }

        /* 
           Το Javatari θα φτιάξει αυτόματα ένα widget με δικό του μέγεθος. 
           Αυτός ο περιέκτης εξασφαλίζει ότι θα κεντραριστεί σωστά.
        */
        #emulator-container {
            background: #000;
            border: 4px solid #333;
            border-radius: 10px;
            padding: 10px;
            margin-bottom: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-width: 640px;
            min-height: 480px;
        }

        /* Virtual Controls */
        .virtual-controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            width: 100%;
            max-width: 500px;
            margin-top: 10px;
        }

        .dpad {
            display: grid;
            grid-template-columns: repeat(3, 50px);
            grid-template-rows: repeat(3, 50px);
            gap: 5px;
            justify-content: center;
        }

        .dpad-btn {
            background: #333;
            border: 2px solid #555;
            border-radius: 8px;
            color: white;
            font-weight: bold;
            user-select: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .dpad-btn:active {
            background: #f0a500;
        }

        .action-container {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .fire-btn {
            width: 70px;
            height: 70px;
            background: #d92027;
            border: 3px solid #ff4d4d;
            border-radius: 50%;
            color: white;
            font-weight: bold;
            box-shadow: 0 4px 0 #990000;
            user-select: none;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            cursor: pointer;
        }

        .fire-btn:active {
            transform: translateY(4px);
            box-shadow: none;
        }

        .info {
            margin-top: 15px;
            font-size: 12px;
            color: #aaa;
        }
    </style>
    
    <!-- 1. Ρυθμίσεις παραμέτρων ΠΡΙΝ φορτώσει το script του Javatari -->
    <script>
        window.Javatari = {
            ROOM: "emulator-container", // Εδώ θα χτιστεί αυτόματα ο emulator
            AUTO_START: true,
            SCRIPTS_PATH: "https://javatari.org"
        };
    </script>
    
    <!-- 2. Φόρτωση του επίσημου Emulator Script -->
    <script src="https://javatari.orgjavatari.js"></script>
</head>
<body>

    <h1>Atari 2600 Emulator</h1>

    <div class="controls-panel">
        <div>
            <label for="local-roms">Παιχνίδια Φακέλου: </label>
            <select id="local-roms" onchange="loadProjectROM(this.value)">
                <option value="">-- Επιλέξτε Παιχνίδι --</option>
            </select>
        </div>

        <div>
            <label for="file-input">Από PC: </label>
            <input type="file" id="file-input" accept=".bin,.rom,.a26" onchange="loadPCROM(this)">
        </div>

        <button onclick="resetEmulator()">Console Reset</button>
    </div>

    <!-- Εδώ μέσα θα εμφανιστεί η κονσόλα αυτόματα -->
    <div id="emulator-container"></div>

    <div class="virtual-controls">
        <div class="dpad">
            <div></div>
            <div class="dpad-btn" id="btn-up">↑</div>
            <div></div>
            <div class="dpad-btn" id="btn-left">←</div>
            <div style="background:transparent"></div>
            <div class="dpad-btn" id="btn-right">→</div>
            <div></div>
            <div class="dpad-btn" id="btn-down">↓</div>
            <div></div>
        </div>
        <div class="action-container">
            <div class="fire-btn" id="btn-fire">FIRE</div>
        </div>
    </div>

    <div class="info">
        <p>⌨️ <b>Πληκτρολόγιο:</b> Βελάκια = Κίνηση | Space / Z = FIRE</p>
        <p>🎮 <b>Χειριστήριο:</b> Πατήστε οποιοδήποτε κουμπί στο Gamepad για ενεργοποίηση.</p>
    </div>

    <script>
        // Διάβασμα του roms/index.json για τις ROMs του Project
        document.addEventListener("DOMContentLoaded", () => {
            fetch("roms/index.json")
                .then(res => res.json())
                .then(data => {
                    const dropdown = document.getElementById("local-roms");
                    data.forEach(rom => {
                        const option = document.createElement("option");
                        option.value = `roms/${rom.file}`;
                        option.textContent = rom.title;
                        dropdown.appendChild(option);
                    });
                })
                .catch(() => {
                    console.log("Το index.json δεν φορτώθηκε (πιθανώς λόγω CORS τοπικά).");
                });
        });

        // 🛠️ ΣΩΣΤΗ ΔΙΑΔΙΚΑΣΙΑ ΦΟΡΤΩΣΗΣ ROM ΣΤΗΝ ΚΟΝΣΟΛΑ JAVATARI
        function insertRomToConsole(fileName, arrayBuffer) {
            try {
                // Μετατροπή των raw bytes σε Binary String που θέλει ο πυρήνας του Javatari
                let binaryString = "";
                const bytes = new Uint8Array(arrayBuffer);
                for (let i = 0; i < bytes.byteLength; i++) {
                    binaryString += String.fromCharCode(bytes[i]);
                }
                
                // Έλεγχος αν η κονσόλα είναι έτοιμη και φόρτωση
                if (window.Javatari && typeof window.Javatari.loadRom === "function") {
                    window.Javatari.loadRom(fileName, binaryString);
                } else {
                    alert("Ο emulator Javatari δεν έχει αρχικοποιηθεί ακόμα.");
                }
            } catch (error) {
                console.error(error);
                alert("Αποτυχία ανάγνωσης του αρχείου ROM.");
            }
        }

        // Φόρτωση ROM από τον φάκελο του Project
        function loadProjectROM(path) {
            if (!path) return;
            const name = path.split('/').pop();
            fetch(path)
                .then(res => {
                    if (!res.ok) throw new Error();
                    return res.arrayBuffer();
                })
                .then(buffer => {
                    insertRomToConsole(name, buffer);
                })
                .catch(() => alert("Σφάλμα: Το αρχείο δεν βρέθηκε στο φάκελο roms/ ή υπάρχει θέμα CORS."));
        }

        // Φόρτωση ROM τοπικά από το PC (ΔΕΝ επηρεάζεται από CORS, παίζει πάντα!)
        function loadPCROM(element) {
            const file = element.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                insertRomToConsole(file.name, e.target.result);
            };
            reader.readAsArrayBuffer(file);
        }

        function resetEmulator() {
            if (window.Javatari && typeof window.Javatari.keyDown === "function") {
                window.Javatari.keyDown(112); // F1 Key (Reset)
                setTimeout(() => window.Javatari.keyUp(112), 100);
            }
        }

        // --- ΕΙΚΟΝΙΚΑ ΚΟΥΜΠΙΑ ---
        function bindVirtualKey(id, code) {
            const el = document.getElementById(id);
            if (!el) return;
            
            const press = (e) => { e.preventDefault(); if(window.Javatari.keyDown) window.Javatari.keyDown(code); };
            const release = (e) => { e.preventDefault(); if(window.Javatari.keyUp) window.Javatari.keyUp(code); };

            el.addEventListener('mousedown', press);
            el.addEventListener('mouseup', release);
            el.addEventListener('touchstart', press);
            el.addEventListener('touchend', release);
        }
        bindVirtualKey('btn-up', 38);
        bindVirtualKey('btn-down', 40);
        bindVirtualKey('btn-left', 37);
        bindVirtualKey('btn-right', 39);
        bindVirtualKey('btn-fire', 32); // Space

        // --- ΥΠΟΣΤΗΡΙΞΗ ΧΕΙΡΙΣΤΗΡΙΟΥ (GAMEPAD) ---
        let activeGamepad = null;
        const keysPressed = { up: false, down: false, left: false, right: false, fire: false };

        window.addEventListener("gamepadconnected", (e) => {
            activeGamepad = e.gamepad.index;
            runGamepadLoop();
        });
        window.addEventListener("gamepaddisconnected", () => { activeGamepad = null; });

        function runGamepadLoop() {
            if (activeGamepad === null) return;
            const gp = navigator.getGamepads()[activeGamepad];
            if (!gp) return;
