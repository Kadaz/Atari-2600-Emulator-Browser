<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Retro Land - Atari 2600 (Auto-Reset Fixed)</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    background: #050505;
    color: #f0f0f0;
    font-family: Arial, Helvetica, sans-serif;
    overflow-x: hidden;
}

body {
    display: flex;
    justify-content: center;
}

#app {
    width: 100%;
    max-width: 1000px;
    padding: 16px;
}

h1 {
    margin: 0 0 6px 0;
    font-size: 24px;
}

.subtitle {
    margin-bottom: 16px;
    color: #aaa;
    font-size: 13px;
}

.panel {
    background: #111;
    border: 1px solid #333;
    border-radius: 10px;
    padding: 14px;
    margin-bottom: 12px;
}

.row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
}

button, select, input[type="file"] {
    font: inherit;
}

button, select {
    background: #1c1c1c;
    color: white;
    border: 1px solid #444;
    border-radius: 6px;
    padding: 9px 12px;
}

button:active {
    transform: scale(0.98);
}

#fileInput {
    width: 100%;
    max-width: 500px;
}

#status {
    margin-top: 10px;
    color: #8f8;
    font-size: 13px;
    white-space: pre-wrap;
}

#cpuInfo {
    font-family: monospace;
    font-size: 12px;
    line-height: 1.6;
    color: #bbb;
}

/* Container που θα φιλοξενήσει το πραγματικό Atari Screen */
#screen-container {
    display: block;
    width: 100%;
    max-width: 640px;
    margin: 0 auto;
    border: 2px solid #333;
    background: #000;
}

.controls {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    max-width: 420px;
    margin: 0 auto;
}

.control {
    min-height: 52px;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
}

.control.empty {
    visibility: hidden;
}

.small {
    font-size: 12px;
    color: #888;
    margin-top: 10px;
}
</style>

<!-- Εισάγουμε τον ολοκληρωμένο cross-platform open-source πυρήνα Atari 2600 -->
<script src="https://javatari.org"></script>
</head>

<body>

<div id="app">

    <h1>Retro Land - Atari 2600</h1>
    <div class="subtitle">
        Atari 2600 browser emulator foundation (Auto-Reset Enabled)
    </div>

    <div class="panel">
        <div style="margin-top:10px;">
            <input id="fileInput" type="file" accept=".bin,.a26,.rom">
        </div>
        <div id="status">Ready. Load an Atari ROM (.bin) to play!</div>
    </div>

    <div class="panel">
        <!-- Εδώ εμφανίζεται το κανονικό παιχνίδι -->
        <div id="screen-container"></div>
        <div class="small">
            Video output connected successfully to HTML5 Video Core.
        </div>
    </div>

    <div class="panel">
        <div id="cpuInfo">
            CPU Status: Active (Javatari JS-Core Engine)
        </div>
    </div>

    <div class="panel">
        <div class="controls">
            <button class="control empty"></button>
            <button class="control" id="btn-up">UP</button>
            <button class="control empty"></button>

            <button class="control" id="btn-left">LEFT</button>
            <button class="control" id="btn-fire" style="background:#cc0000;">FIRE</button>
            <button class="control" id="btn-right">RIGHT</button>

            <button class="control empty"></button>
            <button class="control" id="btn-down">DOWN</button>
            <button class="control empty"></button>
        </div>

        <div class="small">
            Keyboard: Arrow Keys = Joystick · Space = Fire · F2 = Console Reset
        </div>
    </div>

</div>

<script>
"use strict";

window.addEventListener("load", function() {
    // 1. Αρχικοποίηση του συστήματος γραφικών μέσα στο panel
    Javatari.initialize("screen-container");
    
    // 2. Σύνδεση του File Input για να φορτώνεις τις δικές σου ROMs (.bin)
    const fileInput = document.getElementById('fileInput');
    const statusDiv = document.getElementById('status');
    
    fileInput.addEventListener('change', function(e) {
        const file = e.target.files;
        if (!file || file.length === 0) return;
        
        statusDiv.innerText = "Loading " + file[0].name + "...";
        
        const reader = new FileReader();
        reader.onload = function(event) {
            const romData = new Uint8Array(event.target.result);
            
            // Φόρτωση της ROM στον Emulator
            Javatari.loadRom(romData);
            
            // ΑΥΤΟΜΑΤΟ RESET: Δίνει εντολή εκκίνησης μετά από 300ms για να προλάβει να φορτώσει η PAL ROM
            setTimeout(() => {
                window.dispatchEvent(new KeyboardEvent('keydown', { key: 'F2', keyCode: 113, which: 113 }));
                window.dispatchEvent(new KeyboardEvent('keyup', { key: 'F2', keyCode: 113, which: 113 }));
                statusDiv.innerText = "ROM Loaded Successfully! Playing: " + file[0].name;
            }, 300);
        };
        reader.readAsArrayBuffer(file[0]);
    });

    // 3. Σύνδεση των On-Screen κουμπιών σου με τον εξομοιωτή (Grips & Touches)
    setupMobileControls();
});

function setupMobileControls() {
    const mappings = [
        { id: 'btn-up', key: 'ArrowUp', code: 38 },
        { id: 'btn-down', key: 'ArrowDown', code: 40 },
        { id: 'btn-left', key: 'ArrowLeft', code: 37 },
        { id: 'btn-right', key: 'ArrowRight', code: 39 },
        { id: 'btn-fire', key: ' ', code: 32 }
    ];

    mappings.forEach(control => {
        const btn = document.getElementById(control.id);
        if (!btn) return;

        // Λειτουργία για άγγιγμα σε κινητά/τάμπλετ ή κλικ με ποντίκι
        const press = (e) => {
            e.preventDefault();
            window.dispatchEvent(new KeyboardEvent('keydown', { key: control.key, keyCode: control.code, which: control.code }));
        };
        
        const release = (e) => {
            e.preventDefault();
            window.dispatchEvent(new KeyboardEvent('keyup', { key: control.key, keyCode: control.code, which: control.code }));
        };

        btn.addEventListener('mousedown', press);
        btn.addEventListener('mouseup', release);
        btn.addEventListener('touchstart', press);
        btn.addEventListener('touchend', release);
    });
}
</script>

</body>
</html>
